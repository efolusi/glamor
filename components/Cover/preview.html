<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Komando</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--panel); color:var(--text); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .slab { fill:var(--accent); rx:var(--radius-12); }
  .warn { fill:var(--warn); rx:var(--radius-12); }
  .plate { fill:var(--text3); rx:var(--radius-12); }
  .track { fill:var(--border); }
  .fill { fill:var(--ok); }
  .dot.cut { fill:var(--panel); }
  .dot.ok { fill:var(--ok); }
  .dot.warn { fill:var(--warn); }
  .words { position:absolute; left:var(--space-32); bottom:var(--space-32); max-width:440px; }
  .name { margin:0; font-size:100px; line-height:.92; font-weight:600; letter-spacing:-.025em; color:var(--text); }
  .tag { margin:var(--space-8) 0 0 var(--space-4); font-size:14px; line-height:20px; color:var(--text2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary 144x252 off the top (the one black button, largest) / warn 96x120 (attention) / text3 faceplate 208x252 off the top and right / ok 64x12 on a border track 96x12 (a group's bar), about 40% of 960x288
  arrangement one tall slab, a narrow column with the bar under it, a perforated faceplate bleeding off; bottoms on one line space-48 above the edge, gutters space-16
  pattern     precise, technical, mono: a grid of status dots (dot-8) at a space-32 pitch cut from the faceplate in panel, a few lit in ok and warn, like LEDs on a rack
  scales      gutters space-16, pitch space-32, slab, warn and faceplate radius-12, bar a capsule (rx 6, half of 12); the name sits space-32 from the corner
-->
<rect class="slab" x="16" y="-12" width="144" height="252" rx="12"/>
<rect class="warn" x="176" y="72" width="96" height="120" rx="12"/>
<rect class="track" x="176" y="228" width="96" height="12" rx="6"/>
<rect class="fill" x="176" y="228" width="64" height="12" rx="6"/>
<rect class="plate" x="288" y="-12" width="208" height="252" rx="12"/>
<circle class="dot cut" cx="312" cy="24" r="4"/>
<circle class="dot cut" cx="344" cy="24" r="4"/>
<circle class="dot ok" cx="376" cy="24" r="4"/>

<circle class="dot cut" cx="472" cy="24" r="4"/>

<circle class="dot cut" cx="472" cy="56" r="4"/>

<circle class="dot cut" cx="344" cy="88" r="4"/>

<circle class="dot warn" cx="376" cy="120" r="4"/>
<circle class="dot cut" cx="408" cy="120" r="4"/>
<circle class="dot cut" cx="440" cy="120" r="4"/>
<circle class="dot cut" cx="472" cy="120" r="4"/>
<circle class="dot ok" cx="312" cy="152" r="4"/>
<circle class="dot cut" cx="344" cy="152" r="4"/>
<circle class="dot cut" cx="376" cy="152" r="4"/>
<circle class="dot cut" cx="408" cy="152" r="4"/>

<circle class="dot ok" cx="472" cy="152" r="4"/>

</svg>
</div>
<div class="words">
<h1 class="name">Komando</h1>

</div>
