<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SidebarRail preview</title></head>
<body>
<div id="root" class="k-stage"></div>
<script>
  var K = window.Komando, h = React.createElement;
  // The rail is 72 wide (rail-width) and its column 184 (sidebar-width less rail-width); together the sidebar's 256.
  var AREAS = [['house', 'Home'], ['scope', 'Targets'], ['square.on.square', 'Across'], ['person.2', 'Own'], ['info.circle', 'About'], ['gearshape', 'Settings']];
  var PLACES = ['Host', 'Database', 'Cache', 'Queue', 'Storage'];
  var item = { position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 'var(--space-4)', height: 52, border: 0, borderRadius: 'var(--radius-8)', font: 'inherit', fontSize: 12, lineHeight: '16px', color: 'var(--text2)', background: 'transparent' };
  var chosen = { color: 'var(--text)', background: 'var(--panel)', boxShadow: 'inset 0 0 0 1px var(--border)' };
  var marker = { position: 'absolute', left: 'var(--space-4)', top: '20%', width: 4, height: '60%', borderRadius: 'var(--radius-full)', background: 'var(--selected-marker)' };
  var row = { display: 'flex', alignItems: 'center', gap: 'var(--space-8)', height: 32, padding: '0 var(--space-12)', borderRadius: 'var(--radius-8)', fontSize: 13, color: 'var(--text2)' };
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { style: { display: 'flex', height: 320, width: 256, background: 'var(--window)' } },
      h('nav', { 'aria-label': 'Sidebar', style: { width: 72, display: 'flex', flexDirection: 'column', gap: 'var(--space-2)', padding: '40px var(--space-4) var(--space-8)' } },
        AREAS.map(function (a, i) {
          var on = a[1] === 'Targets';
          return h('button', { key: a[1], type: 'button', 'aria-current': on ? 'true' : undefined, title: a[1], style: Object.assign({}, item, on ? chosen : {}) },
            on ? h('span', { style: marker, 'aria-hidden': 'true' }) : null,
            h(K.SFSymbol, { name: a[0], size: 24 }), h('span', null, a[1]));
        }),
        h('div', { style: { flex: 1 } }),
        h('div', { style: { alignSelf: 'center', width: 32, height: 32, borderRadius: '50%', background: 'var(--avatar)', color: 'var(--onAvatar)', display: 'grid', placeItems: 'center', fontSize: 13, fontWeight: 500 }, 'aria-label': 'Alex Morgan, Local · on this Mac' }, 'A')),
      h('section', { 'aria-label': 'Targets', style: { width: 184, display: 'flex', flexDirection: 'column', gap: 'var(--space-2)', padding: '0 var(--space-8)' } },
        h('h2', { style: { margin: 0, height: 40, display: 'flex', alignItems: 'center', padding: '0 var(--space-12)', fontSize: 16, lineHeight: '20px', fontWeight: 600, color: 'var(--text)' } }, 'Targets'),
        PLACES.map(function (p) { return h('div', { key: p, style: Object.assign({}, row, p === 'Host' ? { position: 'relative', color: 'var(--text)', background: 'var(--panel)', boxShadow: 'inset 0 0 0 1px var(--border)' } : {}) }, p === 'Host' ? h('span', { style: marker, 'aria-hidden': 'true' }) : null, p); })))
  );
</script>
</body>
</html>
