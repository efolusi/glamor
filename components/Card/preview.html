<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Card preview</title></head>
<body>
<div id="root" class="k-stage"></div>
<script>
  var K = window.Komando, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'k-grid3', style: { width: '100%' } },
      h(K.Card, { padding: 16 }, h('div', { className: 'k-row', style: { gap: 'var(--space-12)' } }, h(K.StatusDot, { tone: 'ok', size: 8 }), h('span', { style: { fontWeight: 500 } }, 'Everything looks fine.'))),
      h(K.HoverCard, { hover: true }, h('div', { className: 'k-twoline' }, h('span', { className: 'k-rowtitle' }, 'HoverCard'), h('span', { className: 'k-sub' }, 'Under the pointer: cardHover and a soft shadow'))),
      h(K.Surface, { padding: 12 }, h('span', { className: 'k-mono' }, 'brew install efolusi/tap/komando')))
  );
</script>
</body>
</html>
