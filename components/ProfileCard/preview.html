<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProfileCard preview</title></head>
<body>
<div id="root" class="k-stage k-on-window"></div>
<script>
  var K = window.Komando, h = React.createElement;
  // The sidebar's content width: sidebar-width (256) less space-12 on each side, so 232.
  var SIDEBAR_CONTENT = 'calc(var(--sidebar-width) - 2 * var(--space-12))';
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'k-row', style: { gap: '16px' } },
      h('div', { style: { width: SIDEBAR_CONTENT } }, h(K.ProfileCard, { name: 'You' })),
      h('div', { style: { width: SIDEBAR_CONTENT } }, h(K.ProfileCard, { name: 'Bartholomew' })))
  );
</script>
</body>
</html>
