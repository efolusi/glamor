<!-- @dsCard group="Navigation" height=824 width=1280 subtitle="The one divider every resizable area uses: a hairline with a grip, its states, the sidebar's edge, and the widths each area keeps" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SplitDivider preview</title></head>
<body>
<div id="root"></div>
<style>
  .sd-canvas { min-height: 100vh; display: flex; flex-direction: column; gap: var(--space-24); padding: var(--space-24) var(--space-32); background: var(--window); }
  .sd-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-24); }
  .sd-col { display: flex; flex-direction: column; gap: var(--space-12); min-width: 0; }
  .sd-col > .k-seclabel { padding: 0; }
  .sd-frame { height: 160px; display: flex; overflow: hidden; background: var(--panel); border-radius: var(--radius-12); box-shadow: inset 0 0 0 var(--line) var(--border); }
  .sd-frame.col { flex-direction: column; }
  .sd-area { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: var(--space-8); padding: var(--space-12); }
  .sd-area.fixed { flex: none; width: 112px; }
  .sd-area.low { flex: none; height: 56px; }
  .sd-line { height: 8px; border-radius: var(--radius-full); background: var(--subtle); }
  .sd-col > .k-meta { white-space: normal; }
  .sd-side .sd-line { background: var(--border); }
  .sd-side { display: flex; height: 160px; overflow: hidden; border-radius: var(--radius-12); background: var(--window); box-shadow: inset 0 0 0 var(--line) var(--border); }
  .sd-side-nav { flex: none; width: 120px; display: flex; flex-direction: column; gap: var(--space-8); padding: var(--space-16) var(--space-12); }
  .sd-side-panel { flex: 1 1 auto; margin: var(--space-8) var(--space-8) var(--space-8) 0; background: var(--panel); border-radius: var(--radius-8); box-shadow: inset 0 0 0 var(--line) var(--border); display: flex; flex-direction: column; }
  .sd-side-panel.alone { margin-left: var(--space-8); }
  .sd-side-head { display: flex; align-items: center; gap: var(--space-8); height: var(--control-32); padding: 0 var(--space-8); border-bottom: var(--line) solid var(--border); }
  .sd-side-head .k-traffic { height: auto; padding: 0; }
  .sd-table .k-table td { max-width: none; }
</style>
<script>
  var K = window.Komando, h = React.createElement;

  function Lines(n) { var out = []; for (var i = 0; i < n; i++) out.push(h('div', { key: i, className: 'sd-line', style: { width: (88 - i * 14) + '%' } })); return out; }
  function Split(p) {
    return h('div', { className: 'k-split' + (p.row ? ' row' : '') + (p.state ? ' ' + p.state : ''), role: 'separator', 'aria-orientation': p.row ? 'horizontal' : 'vertical', 'aria-label': p.label, title: 'Drag to resize. Double-click to put it back.' },
      h('i'), p.tip ? h('span', { className: 'k-split-tip' }, p.tip) : null);
  }
  function State(p) {
    return h('div', { className: 'sd-col' },
      h('span', { className: 'k-seclabel' }, p.label),
      h('div', { className: 'sd-frame' + (p.row ? ' col' : '') },
        h('div', { className: 'sd-area' + (p.row ? '' : ' fixed') }, Lines(4)),
        h(Split, { row: p.row, state: p.state, tip: p.tip, label: p.row ? 'Transfers height' : 'List width' }),
        h('div', { className: 'sd-area' + (p.row ? ' low' : '') }, Lines(p.row ? 2 : 4))),
      h('span', { className: 'k-meta' }, p.note));
  }
  function Side(p) {
    return h('div', { className: 'sd-col' },
      h('span', { className: 'k-seclabel' }, p.label),
      h('div', { className: 'sd-side' },
        p.hidden ? null : h('div', { className: 'sd-side-nav' }, Lines(5)),
        p.hidden ? null : h('div', { className: 'k-side-edge on' }),
        h('div', { className: 'sd-side-panel' + (p.hidden ? ' alone' : '') },
          p.hidden ? h('div', { className: 'sd-side-head' },
            h('div', { className: 'k-traffic' }, h('i', { className: 'r' }), h('i', { className: 'y' }), h('i', { className: 'g' })),
            h(K.Button, { variant: 'ghost', size: 'xs', symbol: 'sidebar.left', help: 'Show the sidebar (⌃⌘S)' }),
            h('span', { className: 'k-panel-title' }, 'Files')) : null,
          h('div', { className: 'sd-area' }, Lines(3)))),
      h('span', { className: 'k-meta' }, p.note));
  }

  // Every number is a multiple of 4 and is saved app-wide (owner decision 2026-11-14: the same in every window).
  var areas = [
    { area: 'Sidebar', def: '256', min: '200', max: '320', note: 'Under 200 it hides (⌃⌘S shows it again)' },
    { area: 'Agent drawer', def: '400', min: '320', max: '560', note: 'Whether it is open is remembered too' },
    { area: 'Recipes list', def: '272', min: '224', max: '400', note: '' },
    { area: 'Jobs log', def: '400', min: '320', max: '640', note: '' },
    { area: 'Audit inspector', def: '340', min: '280', max: '480', note: '' },
    { area: 'Files pane', def: 'half', min: '320', max: 'none', note: 'Swap keeps the widths; Show Only folds a pane, the split stays' },
    { area: 'Files transfers (height)', def: '160', min: '96', max: 'half the page', note: 'Folds to its 28 head' },
    { area: 'Query, Cache keys, Terminal splits', def: 'half', min: '240', max: 'none', note: 'Per kind of page; a split keeps its sizes when a pane opens or closes' }
  ];
  var cols = [
    { key: 'area', label: 'Area' },
    { key: 'def', label: 'Default', width: 112, mono: true },
    { key: 'min', label: 'Smallest', width: 96, mono: true },
    { key: 'max', label: 'Largest', width: 128, mono: true },
    { key: 'note', label: 'Notes', render: function (v) { return h('span', { className: 'k-t2' }, v); } }
  ];

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'sd-canvas' },
      h('div', { className: 'sd-row' },
        h(State, { label: 'At rest', note: 'A hairline and a 4 by 24 grip in text3.' }),
        h(State, { label: 'Under the pointer', state: 'hover', note: 'The grip turns accent, the cursor resizes.' }),
        h(State, { label: 'Dragging', state: 'on', tip: '288', note: 'The line turns accent; the width shows, snapped to 4.' }),
        h(State, { label: 'Between rows', row: true, state: 'hover', note: 'The same divider, turned: the transfer queue.' })),
      h('div', { className: 'sd-row' },
        h(Side, { label: 'Sidebar edge', note: 'No hairline: the grip shows under the pointer.' }),
        h(Side, { label: 'Sidebar hidden', hidden: true, note: 'The window buttons and Show Sidebar move into the panel.' }),
        h(State, { label: 'At its smallest', state: 'on', tip: '224 · smallest', note: 'It stops; double-click puts it back.' }),
        h(State, { label: 'Keyboard', state: 'focus', tip: '276', note: 'Focused: ← → move it 4, ⇧ moves it 32.' })),
      h('div', { className: 'k-card sd-table' }, h(K.DataTable, { columns: cols, rows: areas, bare: true, dense: true })))
  );
</script>
</body>
</html>
