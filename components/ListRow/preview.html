<!-- @dsCard group="Content" height=560 width=1280 subtitle="One spec for every list a person picks from: the highlight 8 in from a side list (4 in a card), rows 2 apart, text 12 inside, and the same place at rest, under the pointer, selected and focused" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ListRow preview</title></head>
<body>
<div id="root" class="k-stage"></div>
<style>
  .lr-grid { display: flex; gap: var(--space-24); align-items: flex-start; }
  .lr-col { display: flex; flex-direction: column; gap: var(--space-8); width: 272px; flex: none; }
  .lr-title { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text); }
  .lr-note { font-size: 12px; line-height: 16px; color: var(--text2); }
  .lr-side { background: var(--panel); box-shadow: inset 0 0 0 1px var(--border); border-radius: var(--radius-12); overflow: hidden; }
  .lr-name { font-weight: 500; }
  .lr-count { margin-left: auto; font-size: 12px; line-height: 16px; color: var(--text3); font-variant-numeric: tabular-nums; }
  .lr-contrast { --text3: var(--text2); --border: var(--controlEdge); }
  .lr-spec { font-family: var(--font-mono); font-size: 12px; line-height: 20px; color: var(--text2); white-space: pre; }
</style>
<script>
  var K = window.Komando, h = React.createElement;

  function one(name, count, state) {
    return h('div', { key: name, className: 'k-listrow' + (state ? ' ' + state : ''), tabIndex: 0, role: 'button', 'aria-selected': state === 'on' || undefined },
      h(K.SFSymbol, { name: 'tablecells', size: 16, color: 'text3' }), h('span', null, name), h('span', { className: 'lr-count' }, count));
  }
  function two(name, help, state) {
    return h('div', { key: name, className: 'k-listrow r52' + (state ? ' ' + state : ''), tabIndex: 0, role: 'button' },
      h('div', { className: 'k-twoline' }, h('span', { className: 'lr-name' }, name), h('span', { className: 'k-meta k-trunc' }, help)));
  }
  function side(extra) {
    return h('div', { className: 'lr-side ' + (extra || '') },
      h('div', { className: 'k-sidelist' },
        h('div', { className: 'k-seclabel' }, 'Tables'),
        one('orders', '48K'), one('customers', '9.1K', 'is-hover'), one('invoices', '30K', 'on'),
        one('order_items', '152K', 'is-focus'), one('products', '412'),
        h('div', { className: 'k-seclabel' }, 'Saved'),
        two('restart-nginx', 'Test nginx’s config, restart it', 'on'), two('tail-app-log', 'Last lines of the app log', 'is-hover')));
  }
  function cardRow(name, where, state) {
    return h('div', { key: name, className: 'k-listrow k-cardrow' + (state ? ' ' + state : ''), tabIndex: 0, role: 'button' },
      h('span', { className: 'lr-name' }, name), h('span', { className: 'k-mono k-t2' }, where));
  }
  function sep(k) { return h('div', { key: k, className: 'k-cardlist-sep' }); }

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'lr-grid' },
      h('div', { className: 'lr-col' },
        h('div', { className: 'lr-title' }, 'In a side list'),
        side(),
        h('div', { className: 'lr-note' }, 'At rest · under the pointer (hover-panel) · selected (accent 10% and the marker) · focused (the ring on the highlight). Two lines are 52.')),
      h('div', { className: 'lr-col' },
        h('div', { className: 'lr-title' }, 'Increase Contrast'),
        side('lr-contrast'),
        h('div', { className: 'lr-note' }, 'text3 turns text2 and hairlines turn controlEdge; the marker still says which one is chosen.')),
      h('div', { className: 'lr-col' },
        h('div', { className: 'lr-title' }, 'In a card'),
        h('div', { className: 'k-card k-cardlist' },
          cardRow('web-1', '10.0.0.4'), sep('a'), cardRow('web-2', '10.0.0.5', 'is-hover'), sep('b'),
          cardRow('bastion', '203.0.113.5', 'is-focus'), sep('c'), cardRow('db-1', '10.0.0.9')),
        h('div', { className: 'lr-note' }, 'Each row is 40: a 32 highlight 4 in from the card on every side, so its 8 corners follow the card’s 12. The text starts 16 in, where the hairline starts.')),
      h('div', { className: 'lr-col' },
        h('div', { className: 'lr-title' }, 'The numbers (K.Row)'),
        h('div', { className: 'k-card', style: { padding: 'var(--space-12) var(--space-16)' } },
          h('div', { className: 'lr-spec' },
            'listInset   8   list edge → row', h('br'),
            'cardInset   4   card edge → row', h('br'),
            'padding    12   row edge → text', h('br'),
            'gap         2   row → row', h('br'),
            'radius      8', h('br'),
            'oneLine    32   twoLine 52', h('br'),
            'text at    20   in a side list', h('br'),
            'text at    16   in a card')),
        h('div', { className: 'lr-note' }, 'The text never moves: no state changes its padding or its weight.')))
  );
</script>
</body>
</html>
