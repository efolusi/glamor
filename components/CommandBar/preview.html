<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CommandBar preview</title></head>
<body>
<div id="root" class=""></div>
<script>
  var K = window.Komando, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { style: { width: '100%' } },
      h(K.CommandBar, { placeholder: 'Command for web-1, for example: df -h', value: 'df -h', focused: true, options: [{ label: 'Read-only', on: true }, { label: 'Dry run' }] }))
  );
</script>
</body>
</html>
